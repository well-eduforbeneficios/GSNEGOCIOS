<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>ESMÉER · Gestão</title>
<style>
:root{--bg:#0b0b0c;--cd:#161618;--ln:#2a2a2d;--tx:#f4f1ea;--mu:#9b9a95;--au:#d4af3d;--ok:#4cc38a;--wr:#f0a84b;--er:#ef6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1{font-size:22px;margin:4px 0 14px}h2{margin:0}h3{margin:22px 0 8px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
button{font:inherit;cursor:pointer}.mu{color:var(--mu)}.err{color:var(--er)}
.wrap{max-width:760px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.top small{color:var(--mu)}
.ghost{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:8px 14px}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.neg{border:1px solid var(--ln);border-radius:18px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;color:inherit;transition:transform .15s}
.neg:hover{transform:translateY(-2px)}.neg img{width:100%;max-width:260px;border-radius:8px}.neg span{font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.esm{background:#000;border-color:#3a3320}.esm span{color:var(--au)}.bre{background:#f7e9dd;color:#6b6a3a}.bre span{color:#a0603a}
footer{margin-top:40px;text-align:center;color:var(--mu);font-size:12px}
.login{max-width:360px;margin:12vh auto 0;padding:0 20px;text-align:center}.login img{width:220px;margin-bottom:26px}
input,select{width:100%;background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:12px;font:inherit;margin-bottom:12px}
input:focus,select:focus{outline:2px solid var(--au);border-color:transparent}label{display:block;font-size:12px;color:var(--mu);margin:4px 0 6px}
.btn{width:100%;background:var(--au);color:#111;border:0;border-radius:12px;padding:14px;font-weight:700;margin-top:6px}.btn.sec{background:var(--cd);color:var(--tx);border:1px solid var(--ln)}.btn:disabled{opacity:.5}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:#101011;border-right:1px solid var(--ln);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav img{width:150px;margin:0 auto 18px;display:block}nav button{background:none;border:0;color:var(--mu);text-align:left;padding:12px;border-radius:10px;display:flex;gap:10px}
nav button.on{background:var(--cd);color:var(--au)}nav .sp{flex:1}
main{padding:max(20px,env(safe-area-inset-top)) 22px 40px;max-width:900px;width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi,.card,.row,.ped{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px}
.kpi small{color:var(--mu);display:block;margin-bottom:6px}.kpi b{font-size:20px;color:var(--au)}
.card{margin:12px 0}.list{display:grid;gap:8px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row b{flex:1 1 140px}.row span{color:var(--mu)}
.chip{font-style:normal;font-size:11px;padding:3px 9px;border-radius:99px;background:#26262a;color:var(--mu)}
.ZERADO,.NEGATIVO,.Aberto{background:#3a1d1d;color:var(--er)}.BAIXO{background:#3a2d17;color:var(--wr)}.OK,.Pago{background:#17301f;color:var(--ok)}.Entregue{background:#222;color:var(--mu)}.Aberto{background:#3a2d17;color:var(--wr)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2s{display:grid;grid-template-columns:80px 1fr;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.seg button{background:var(--cd);border:1px solid var(--ln);color:var(--tx);padding:11px;border-radius:10px}.seg .on{border-color:var(--au);color:var(--au)}
.ped{margin-bottom:10px}.ped header{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.ped p{margin:2px 0;color:var(--mu)}.ped .ac{display:flex;gap:8px;margin-top:10px}.ped .ac button{flex:1;margin:0;padding:10px}
.tot{display:flex;justify-content:space-between;font-size:18px;margin:12px 0}.tot b{color:var(--au)}
.md{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}.md>div{background:var(--bg);border:1px solid var(--ln);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:480px}
@media(min-width:800px){.md{align-items:center}.md>div{border-radius:18px}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:99;max-width:90%}
@media(max-width:800px){.shell{grid-template-columns:1fr;padding-bottom:78px}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px max(6px,env(safe-area-inset-bottom));z-index:5;border-top:1px solid var(--ln);border-right:0;justify-content:space-around}
nav img,nav .sp{display:none}nav button{flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 8px}nav button i{font-style:normal;font-size:18px}}
</style></head><body>
<div id="app"></div><div id="toast"></div>

function loginV(){$('#app').innerHTML=`<form class="login" onsubmit="entrar(event)"><img src="${LOGO_E}" alt="ESMÉER"><input id="u" placeholder="Usuário" autocomplete="username" autocapitalize="none"><input id="p" type="password" placeholder="Senha" autocomplete="current-password"><p id="err" class="err"></p><button class="btn" id="lb">Entrar</button><footer>Wellysson Silva · Gestor Comercial</footer></form>`}
async function entrar(e){e.preventDefault();const b=$('#lb');b.disabled=true;$('#err').textContent='';
 try{const j=await api('login',{user:$('#u').value,senha:$('#p').value});S.sess={s:j.sessao,nome:j.nome};localStorage.setItem('sess',JSON.stringify(S.sess));view()}
 catch(x){$('#err').textContent=x.message;b.disabled=false}}
function sair(exp){if(S.sess&&!exp)api('sair').catch(()=>{});S.sess=null;S.d=null;S.neg=null;S.cart=[];localStorage.removeItem('sess');localStorage.removeItem('dados');view()}
function hub(){$('#app').innerHTML=`<div class="wrap"><header class="top"><div><small>Olá,</small><h2>${esc(S.sess.nome)}</h2></div><button class="ghost" onclick="sair()">Sair</button></header>
<div class="cards"><button class="neg esm" onclick="abrir('esmeer')"><img src="${LOGO_E}" alt="ESMÉER"><span>Abrir ESMÉER</span></button>
<button class="neg bre" onclick="toast('Módulo do Brechó: próxima fase')"><img src="${LOGO_B}" alt="Brechó Moda Circular"><span>Em breve</span></button></div>
<footer>Wellysson Silva · Gestor Comercial</footer></div>`}
const TABS=[['painel','Painel','▦'],['pedido','Novo','＋'],['pedidos','Pedidos','☰'],['estoque','Estoque','▤'],['clientes','Clientes','☺']];
function abrir(n){S.neg=n;S.tab='painel';shell();carregar()}
function shell(){$('#app').innerHTML=`<div class="shell"><nav><img src="${LOGO_E}" alt="ESMÉER">${TABS.map(t=>`<button data-t="${t[0]}" onclick="tab('${t[0]}')"><i>${t[2]}</i>${t[1]}</button>`).join('')}<div class="sp"></div><button onclick="S.neg=null;view()"><i>⌂</i>Início</button></nav><main id="main"></main></div>`}
async function carregar(){const m=$('#main');if(!S.d)m.innerHTML='<p class="mu">Carregando…</p>';
 try{S.d=await api('dados');localStorage.setItem('dados',JSON.stringify(S.d))}catch(x){if(!S.d){m.innerHTML=`<p class="err">${esc(x.message)}</p>`;return}toast('Sem conexão: dados salvos')}
 tab(S.tab)}
function tab(t){S.tab=t;document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));V[t]()}
const nome=c=>(S.d.estoque.find(e=>e.codigo===c)||{}).produto||c;
const prod=c=>S.d.produtos.find(p=>p.codigo===c)||{};
const unit=c=>+(S.tc==='Revenda'?prod(c).precoRev:prod(c).precoCons)||0;
const linha=i=>Math.max(i.qtd*unit(i.codigo)*(1-(i.pct||0))-(i.rs||0),0);
function modal(h){const d=document.createElement('div');d.className='md';d.id='md';d.onclick=e=>{if(e.target===d)fechar()};d.innerHTML=`<div>${h}</div>`;document.body.appendChild(d)}
const fechar=()=>{const m=$('#md');m&&m.remove()};
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const V={
painel(){const p=S.d.painel.periodo,g=S.d.painel.geral,rep=S.d.estoque.filter(e=>['ZERADO','BAIXO','NEGATIVO'].includes(e.situacao));
 const k=(a,b)=>`<div class="kpi"><small>${a}</small><b>${b}</b></div>`;
 $('#main').innerHTML=`<h1>Painel</h1><div class="kpis">${k('Faturamento do mês',R(p[0]))}${k('Unidades vendidas',p[1])}${k('Ticket médio',R(p[3]))}${k('Lucro estimado',R(p[5]))}${k('Em estoque',g[3]+' un.')}${k('Valor do estoque',R(g[4]))}</div>
 <h3>Precisa repor (${rep.length})</h3><div class="list">${rep.map(e=>`<div class="row"><b>${esc(e.produto)}</b><span>${esc(e.fragrancia)}</span><em class="chip ${e.situacao}">${e.situacao}</em></div>`).join('')||'<p class="mu">Nada a repor.</p>'}</div>
 <button class="btn sec" style="margin-top:18px" onclick="carregar()">Atualizar</button>`},
pedido(){const cods=[...new Set(S.d.estoque.map(e=>e.codigo))];
 $('#main').innerHTML=`<h1>Novo pedido</h1><label>Cliente</label><input id="cl" list="cls" placeholder="Nome do cliente" value="${esc(S.cli)}" oninput="S.cli=this.value"><datalist id="cls">${S.d.clientes.map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist>
 <div class="seg">${['Consumidor','Revenda'].map(t=>`<button class="${S.tc===t?'on':''}" onclick="S.tc='${t}';V.pedido()">${t}</button>`).join('')}</div>
 <div class="card"><label>Produto</label><select id="pc" onchange="fr()">${cods.map(c=>`<option value="${esc(c)}">${esc(nome(c))}</option>`).join('')}</select><label>Fragrância</label><select id="pf"></select>
 <div class="g2"><div><label>Quantidade</label><input id="pq" type="number" min="1" value="1"></div><div><label>Desconto</label><div class="g2s"><select id="dt"><option value="p">%</option><option value="r">R$</option></select><input id="dv" type="number" min="0" step="0.01" placeholder="0"></div></div></div>
 <button class="btn sec" onclick="add()">Adicionar item</button></div><div id="cart"></div>`;fr();cart()},
pedidos(){const g={};S.d.pedidos.forEach(p=>(g[p.numero]=g[p.numero]||{n:p.numero,data:p.data,cli:p.cliente,st:p.status,it:[]}).it.push(p));
 const L=Object.values(g).sort((a,b)=>b.n-a.n).filter(x=>S.f==='Todos'||x.st===S.f);
 $('#main').innerHTML=`<h1>Pedidos</h1><select onchange="S.f=this.value;V.pedidos()">${opts(['Todos','Aberto','Pago','Entregue'],S.f)}</select>${L.map(x=>{const tot=x.it.reduce((s,i)=>s+(+i.valor||0),0);
 return `<div class="ped"><header><b>#${x.n} · ${esc(x.cli)}</b><em class="chip ${x.st}">${x.st}</em></header>${x.it.map(i=>`<p>${i.qtd}× ${esc(i.produto)} · ${esc(i.fragrancia)} — ${R(i.valor)}</p>`).join('')}<div class="tot"><span>Total</span><b>${R(tot)}</b></div>
 <div class="ac">${x.st==='Aberto'?`<button class="btn" onclick="recebe(${x.n})">Receber</button>`:''}${x.st==='Pago'?`<button class="btn" onclick="entrega(${x.n})">Marcar entregue</button>`:''}<button class="btn sec" onclick="wa(${x.n})">WhatsApp</button></div></div>`}).join('')||'<p class="mu">Nenhum pedido.</p>'}`},
estoque(){const q=(S.q||'').toLowerCase();
 $('#main').innerHTML=`<h1>Estoque</h1><button class="btn" onclick="movM()">Entrada / Baixa</button><input style="margin-top:12px" placeholder="Buscar produto ou fragrância" value="${esc(S.q||'')}" oninput="S.q=this.value;V.estoque();$('main input').focus()"><div class="list">${S.d.estoque.filter(e=>(e.produto+' '+e.fragrancia).toLowerCase().includes(q)).map(e=>`<div class="row"><b>${esc(e.produto)}</b><span>${esc(e.fragrancia)}</span><b style="flex:0">${e.estoque}</b><em class="chip ${e.situacao}">${e.situacao}</em></div>`).join('')}</div>`},
clientes(){const q=(S.qc||'').toLowerCase();
 $('#main').innerHTML=`<h1>Clientes</h1><button class="btn" onclick="cliM()">Novo cliente</button><input style="margin-top:12px" placeholder="Buscar cliente" value="${esc(S.qc||'')}" oninput="S.qc=this.value;V.clientes();$('main input').focus()"><div class="list">${S.d.clientes.filter(c=>c.nome.toLowerCase().includes(q)).map(c=>`<div class="row"><b>${esc(c.nome)}</b><span>${esc(c.telefone)}</span><span>${R(c.total)}</span><button class="ghost" onclick="exclui('${esc(c.nome).replace(/'/g,"\\'")}')">Excluir</button></div>`).join('')}</div>`}};
function fr(){const c=$('#pc').value;$('#pf').innerHTML=S.d.estoque.filter(e=>e.codigo===c).map(e=>`<option value="${esc(e.fragrancia)}">${esc(e.fragrancia)} (estoque ${e.estoque})</option>`).join('')}
function add(){const c=$('#pc').value,f=$('#pf').value,q=+$('#pq').value,v=+$('#dv').value||0;if(!f||q<1)return toast('Confira produto, fragrância e quantidade');
 const e=S.d.estoque.find(x=>x.codigo===c&&x.fragrancia===f);if(e&&q>e.estoque&&!confirm('Quantidade maior que o estoque ('+e.estoque+'). Adicionar mesmo assim?'))return;
 S.cart.push({codigo:c,fragrancia:f,qtd:q,pct:$('#dt').value==='p'&&v?v/100:0,rs:$('#dt').value==='r'?v:0});cart()}
function cart(){const t=S.cart.reduce((s,i)=>s+linha(i),0);
 $('#cart').innerHTML=S.cart.length?`<h3>Itens</h3><div class="list">${S.cart.map((i,n)=>`<div class="row"><b>${i.qtd}× ${esc(nome(i.codigo))} · ${esc(i.fragrancia)}</b><span>${R(linha(i))}</span><button class="ghost" onclick="S.cart.splice(${n},1);cart()">✕</button></div>`).join('')}</div>
 <div class="tot"><span>Total</span><b>${R(t)}</b></div><label>Forma de pagamento (para receber agora)</label><select id="fp"><option value="">Escolher…</option>${opts(S.d.formas)}</select>
 <button class="btn" onclick="salvar(true)">Finalizar e receber</button><button class="btn sec" onclick="salvar(false)">Salvar em aberto</button>`:''}
async function salvar(fin){const cli=$('#cl').value.trim(),forma=($('#fp')||{}).value;if(!cli)return toast('Informe o cliente');if(fin&&!forma)return toast('Escolha a forma de pagamento');
 document.querySelectorAll('.btn').forEach(b=>b.disabled=true);
 try{if(!S.d.clientes.some(c=>c.nome===cli))await api('cliente',{nome:cli});
  const j=await api('pedido',{cliente:cli,tipoCliente:S.tc,status:'Aberto',itens:S.cart.map(i=>({codigo:i.codigo,fragrancia:i.fragrancia,qtd:i.qtd,descPct:i.pct||'',descRs:i.rs||''}))});
  if(fin)await api('finalizar',{numero:j.numero,forma});
  S.cart=[];S.cli='';S.tab='pedidos';await carregar();toast('Pedido #'+j.numero+(fin?' finalizado':' salvo em aberto'))}
 catch(x){toast(x.message);document.querySelectorAll('.btn').forEach(b=>b.disabled=false)}}
function recebe(n){modal(`<h3>Receber pedido #${n}</h3><select id="mf">${opts(S.d.formas)}</select><button class="btn" onclick="fin(${n})">Confirmar</button><button class="btn sec" onclick="fechar()">Cancelar</button>`)}
async function fin(n){const forma=$('#mf').value;try{await api('finalizar',{numero:n,forma});fechar();await carregar();toast('Pedido recebido')}catch(x){toast(x.message)}}
async function entrega(n){try{await api('status',{numero:n,status:'Entregue'});await carregar()}catch(x){toast(x.message)}}
function wa(n){const it=S.d.pedidos.filter(p=>p.numero===n),c=it[0].cliente,tot=it.reduce((s,i)=>s+(+i.valor||0),0),cl=S.d.clientes.find(x=>x.nome===c);
 const txt=`*ESMÉER* · Pedido #${n}\nCliente: ${c}\n\n`+it.map(i=>`• ${i.qtd}× ${i.produto} ${i.fragrancia}: ${R(i.valor)}`).join('\n')+`\n\n*Total: ${R(tot)}*\nObrigado pela preferência!`;
 let t=cl&&cl.telefone?String(cl.telefone).replace(/\D/g,''):'';if(t&&t.length<=11)t='55'+t;open('https://wa.me/'+t+'?text='+encodeURIComponent(txt),'_blank')}
function movM(){const cods=[...new Set(S.d.estoque.map(e=>e.codigo))];
 modal(`<h3>Entrada / Baixa</h3><div class="seg" id="mt"><button class="on" onclick="mt(this)">Entrada</button><button onclick="mt(this)">Baixa</button></div><select id="mc" onchange="mf2()">${cods.map(c=>`<option value="${esc(c)}">${esc(nome(c))}</option>`).join('')}</select><select id="mfr"></select><input id="mq" type="number" min="1" value="1"><input id="mo" placeholder="Observação (opcional)"><button class="btn" onclick="movS()">Lançar</button><button class="btn sec" onclick="fechar()">Cancelar</button>`);mf2()}
const mt=b=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};
const mf2=()=>{$('#mfr').innerHTML=S.d.estoque.filter(e=>e.codigo===$('#mc').value).map(e=>`<option>${esc(e.fragrancia)}</option>`).join('')};
async function movS(){const tipo=$('#mt .on').textContent,q=+$('#mq').value;if(q<1)return toast('Quantidade inválida');
 try{await api('mov',{linhas:[{data:new Date().toLocaleDateString('sv'),tipo,codigo:$('#mc').value,fragrancia:$('#mfr').value,qtd:q,obs:$('#mo').value}]});fechar();await carregar();toast(tipo+' lançada')}catch(x){toast(x.message)}}
function cliM(){modal(`<h3>Novo cliente</h3><input id="cn" placeholder="Nome"><input id="ct" type="tel" placeholder="Telefone com DDD"><button class="btn" onclick="cliS()">Salvar</button><button class="btn sec" onclick="fechar()">Cancelar</button>`)}
async function cliS(){const n=$('#cn').value.trim();if(!n)return toast('Informe o nome');try{await api('cliente',{nome:n,telefone:$('#ct').value});fechar();await carregar()}catch(x){toast(x.message)}}
async function exclui(n){if(!confirm('Excluir os dados de '+n+'? Essa ação não pode ser desfeita.'))return;try{await api('excluirCliente',{nome:n});await carregar();toast('Cliente excluído')}catch(x){toast(x.message)}}
view();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
